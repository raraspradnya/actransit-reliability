name: collect-realtime

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs are best-effort and often lag
  workflow_dispatch:         # enables the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: collect-realtime
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests gtfs-realtime-bindings

      - name: Snapshot feeds
        env:
          ACT_TOKEN: ${{ secrets.ACT_TOKEN }}
          API_511_KEY: ${{ secrets.API_511_KEY }}
        run: python collect.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
