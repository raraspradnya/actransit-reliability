name: collect-realtime

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs are best-effort and often lag
  workflow_dispatch:         # enables the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: collect-realtime
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests gtfs-realtime-bindings

      - name: Snapshot feeds
        env:
          ACT_TOKEN: ${{ secrets.ACT_TOKEN }}
          API_511_KEY: ${{ secrets.API_511_KEY }}
        run: python collect.py

      # The feeds don't report delays; they're computed against the static schedule.
      # Refresh it when the newest copy is more than 7 days old.
      - name: Refresh static schedule (weekly)
        env:
          ACT_TOKEN: ${{ secrets.ACT_TOKEN }}
          API_511_KEY: ${{ secrets.API_511_KEY }}
        run: |
          # File names end in _YYYY-MM-DD.zip (see fetch_static.py)
          newest=$(ls data/static/*.zip 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
          if [ -z "$newest" ] || [[ "$newest" < "$(date -u -d '7 days ago' +%F)" ]]; then
            python fetch_static.py || echo "static fetch failed; will retry next run"
          else
            echo "schedule from $newest is recent enough"
          fi

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          [ -d data/static ] && git add data/static
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
